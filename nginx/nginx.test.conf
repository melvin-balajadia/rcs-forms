worker_processes auto;

events {
    worker_connections 1024;
}

# TLS passthrough — client and server terminate their own HTTPS,
# this just forwards raw TCP to the right container.
stream {
    resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS — resolve per-connection instead of once at startup

    server {
        listen 1002;
        set $client_upstream client:443;
        proxy_pass $client_upstream;
    }

    server {
        listen 8082;
        set $server_upstream server:8082;
        proxy_pass $server_upstream;
    }
}
