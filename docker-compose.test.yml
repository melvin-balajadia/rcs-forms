# =============================================================================
# docker-compose.test.yml — TEST / STAGING
# Usage: docker compose -f docker-compose.test.yml up -d --build
# Client:  https://mqfdform.royalecoldstorage.com.ph:1002
# Server:  https://mqfdform.royalecoldstorage.com.ph:8082
# =============================================================================

# Pinned so the DB volume is always the same one, whether deployed by CI
# (from the runner workspace) or manually (from any clone).
name: qfsd-test

services:
  # ─── Client (Vite/React) ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://mqfdform.royalecoldstorage.com.ph:8082
    image: qfsd-client:test
    container_name: qfsd_client_test
    restart: unless-stopped
    volumes:
      - ./server/certificates:/etc/nginx/certs:ro # SSL certs for client's internal nginx
    networks:
      - qfsd_test_network
    depends_on:
      - server

  # ─── Server (Node/Express) ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: qfsd-server:test
    container_name: qfsd_server_test
    restart: unless-stopped
    env_file:
      - ./server/.env.test
    volumes:
      - ./server/certificates:/app/certificates:ro # SSL certs (read-only)
      - qfsd_test_server_logs:/app/logs # Persistent logs
    networks:
      - qfsd_test_network
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8082" # PORT_TEST (NODE_ENV=test) — internal only, Nginx proxies to this

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: qfsd_nginx_test
    restart: unless-stopped
    ports:
      - "1002:1002" # Client public port
      - "8082:8082" # Server public port
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
    networks:
      - qfsd_test_network
    depends_on:
      - client
      - server

  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: qfsd_mysql_test
    restart: unless-stopped
    env_file:
      - ./server/.env.test # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    volumes:
      - qfsd_test_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro # Seed scripts (optional)
    networks:
      - qfsd_test_network
    ports:
      - "3309:3306" # Internal only — never expose DB port publicly
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  qfsd_test_mysql_data:
    # Reuses the DB volume from the old manual deploy (C:\All Projects\qfsd-forms)
    # so the CI-driven stack picks up existing data instead of starting empty.
    external: true
    name: qfsd-forms_mysql_data
  qfsd_test_server_logs:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  qfsd_test_network:
    driver: bridge
