server {
    listen 443 ssl;
    server_name mqfdform.royalecoldstorage.com.ph;

    # Certs are bind-mounted from ./server/certificates on the host
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;
    ssl_trusted_certificate /etc/nginx/certs/inter.crt;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend (avoids CORS issues from browser)
    location /api/ {
        proxy_pass https://server:8082;   # internal Docker service name
        proxy_ssl_verify off;             # self-signed or internal CA — disable for internal traffic
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# Redirect HTTP → HTTPS (optional but recommended)
server {
    listen 80;
    server_name mqfdform.royalecoldstorage.com.ph;
    return 301 https://$host$request_uri;
}