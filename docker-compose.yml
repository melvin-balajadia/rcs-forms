services:
  # ─── Client (Vite/React) ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://mqfdform.royalecoldstorage.com.ph:8082
    container_name: qfsd_client
    restart: unless-stopped
    volumes:
      - ./server/certificates:/etc/nginx/certs:ro # SSL certs for client's internal nginx
    networks:
      - app_network
    depends_on:
      - server

  # ─── Server (Node/Express) ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qfsd_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server/certificates:/app/certificates:ro # SSL certs (read-only)
      - server_logs:/app/logs # Persistent logs
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8082" # PORT_TEST (NODE_ENV=test) — internal only, Nginx proxies to this

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: qfsd_nginx
    restart: unless-stopped
    ports:
      - "1002:1002" # Client public port
      - "8082:8082" # Server public port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - client
      - server

  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: qfsd_mysql
    restart: unless-stopped
    env_file:
      - ./server/.env # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro # Seed scripts (optional)
    networks:
      - app_network
    ports:
      - "3309:3306" # Internal only — never expose DB port publicly
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  server_logs:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
