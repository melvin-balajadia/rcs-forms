name: Deploy to Test

on:
  push:
    branches: [dev]
  # Do NOT enable workflow_dispatch / pull_request triggers on a self-hosted runner
  # until branch protection + required reviews are enforced.

# Least-privilege token — we only need to read the repo to deploy.
permissions:
  contents: read

# NO concurrency group on purpose. Each site's self-hosted runner already
# serializes its own deploys (one job at a time on that machine). A GitHub
# concurrency group here only deadlocks on Windows: a cancel can't finalize (no
# live worker to ack it), so the cancelled run stays "in progress" forever and
# every new run queues behind that ghost and never dispatches.

jobs:
  # One file per site (sites/<site>.conf) drives the matrix below — adding a
  # new site is "drop in a new .conf file", not a workflow edit.
  discover-sites:
    name: Discover sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          sites=$(ls sites/*.conf | xargs -n1 basename -s .conf | jq -R -s -c 'split("\n")[:-1]')
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "Discovered sites: $sites"

  deploy:
    name: Deploy Test Stack
    needs: discover-sites
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.discover-sites.outputs.sites) }}
    runs-on: [self-hosted, "${{ matrix.site }}-test"]
    environment: "${{ matrix.site }}-test"
    timeout-minutes: 20

    steps:
      # ── 1. Stop this site's existing containers FIRST (releases Windows
      # file locks) — targets purely by project name/label, so it needs no
      # site config file and can safely run before checkout.
      - name: Stop existing containers
        shell: cmd
        run: |
          "C:\Program Files\Git\bin\bash.exe" -c "docker compose -p qfsd-${{ matrix.site }}-test down -t 30 --remove-orphans || true"

      # ── 2. Checkout source ────────────────────────────────────────────────
      # clean: false as defense-in-depth, but the certs no longer depend on
      # it surviving — see the restore step below.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: false

      # ── 3. Restore SSL certs from a stable, workspace-independent location ─
      # server/certificates/ is git-ignored, so it isn't in the checkout at
      # all. Restoring from C:\qfsdforms-certs (outside the runner's _work
      # tree) instead of relying on the workspace never being wiped — commands
      # like `rd /s /q` on a locked workspace (see README Troubleshooting)
      # would otherwise take the shared cert down with it, for every site.
      - name: Restore certs
        shell: cmd
        run: |
          xcopy "C:\qfsdforms-certs" "%CD%\server\certificates\" /E /I /Y

      # ── 4. Write this site's .env (masked; cleaned up in finally below) ───
      - name: Create site .env
        # Invoked through cmd with -ExecutionPolicy Bypass: `shell: powershell`
        # writes a .ps1 to the runner temp dir, which a host with the default
        # Restricted execution policy refuses to load (UnauthorizedAccess).
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$env:SITE_ENV | Set-Content -Path 'server\.env.${{ matrix.site }}.test' -Encoding UTF8"
        env:
          SITE_ENV: ${{ secrets.SITE_ENV }}

      # ── 5. Build + deploy + verify — all handled by deploy.sh, in the
      # correct order (snapshot before build, then build+up, then health
      # check), so there's exactly one place that logic lives.
      - name: Deploy site stack
        shell: cmd
        run: |
          "C:\Program Files\Git\bin\bash.exe" -c "bash deploy.sh ${{ matrix.site }} test --build"

      # ── 6. Dump logs on failure ───────────────────────────────────────────
      # Without this a failed deploy leaves nothing to read — the containers are
      # still up here, but debugging by hand needs the .env that step 7 deletes.
      # -p only (no -f): matches by project label, so it needs neither the
      # site's compose files nor the sourced env vars.
      - name: Container logs on failure
        if: failure()
        shell: cmd
        run: |
          "C:\Program Files\Git\bin\bash.exe" -c "docker compose -p qfsd-${{ matrix.site }}-test logs --tail=100 || true"
          "C:\Program Files\Git\bin\bash.exe" -c "docker inspect --format '{{json .State.Health}}' qfsd_${{ matrix.site }}_mysql_test || true"

      # ── 7. ALWAYS remove this site's .env from the workspace ──────────────
      - name: Cleanup .env file
        if: always()
        shell: cmd
        run: |
          if exist server\.env.${{ matrix.site }}.test (del server\.env.${{ matrix.site }}.test && echo [INFO] .env removed.)
